name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Default lane: SQLite/InMemory only. SQL Server integration tests skip
  # themselves when SQL_SERVER_CONNECTION is not set.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SaaSAgentSample.slnx

      - name: Build
        run: dotnet build SaaSAgentSample.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SaaSAgentSample.slnx --configuration Release --no-build --verbosity normal

  # Authoritative SQL Server lane. Uses the same 2022 image the local
  # docker-compose.yml starts, so the migration is validated end-to-end.
  build-test-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'yourStrong(!)Password'
          MSSQL_PID: 'Developer'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'yourStrong(!)Password' -No -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SQL_SERVER_CONNECTION: 'Server=localhost,1433;Database=SaasAgentSample;User Id=sa;Password=yourStrong(!)Password;TrustServerCertificate=True;'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SaaSAgentSample.slnx

      - name: Build
        run: dotnet build SaaSAgentSample.slnx --configuration Release --no-restore

      - name: Wait for SQL Server readiness
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'yourStrong(!)Password' -No -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "SQL Server ready"; exit 0
            fi
            echo "Waiting for SQL Server ($i)..."; sleep 3
          done
          echo "SQL Server did not become ready in time" >&2; exit 1

      - name: Test (SQL Server lane)
        run: dotnet test SaaSAgentSample.slnx --configuration Release --no-build --verbosity normal

  # Emulator lane: builds the vendored Fulfillment API Emulator on Node 18 (the
  # same base image emulator/docker/Dockerfile uses) and smoke-tests that it
  # actually starts. This guards against dependency bumps that compile fine but
  # crash the emulator at startup — e.g. an ESM-only major of a CommonJS
  # dependency, which `require()` cannot load on Node 18. The .NET lanes above
  # never build the emulator, so without this lane such a bump would pass CI and
  # (via Dependabot auto-merge) only surface at `azd up`. Node 18 is used on
  # purpose so require()-of-ESM regressions fail here, not in the cloud.
  build-emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build (tsc)
        run: npx tsc

      - name: Unit tests (jest)
        run: npm test

      - name: Smoke test (emulator starts on Node 18)
        run: |
          set -e
          PORT=8080 SKIP_DATA_LOAD=true node dist/index.js > emu.log 2>&1 &
          PID=$!
          up=0
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Emulator process exited during startup:"; cat emu.log; exit 1
            fi
            if grep -q "Listening to" emu.log; then up=1; break; fi
            sleep 0.5
          done
          if [ "$up" != "1" ]; then
            echo "Emulator did not report readiness in time:"; cat emu.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          echo "Emulator started on Node 18. Probing HTTP endpoint..."
          curl -fsS "http://localhost:8080/" -o /dev/null && echo "HTTP 200 OK" || echo "warn: HTTP probe failed (non-fatal)"
          kill "$PID" 2>/dev/null || true
          echo "Smoke test passed."

  # The infrastructure is only exercised by `azd up`, which nothing in CI runs, so a template
  # that does not compile could reach main and only fail at deploy time. It did. Compiling is
  # cheap and catches the whole class.
  build-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
