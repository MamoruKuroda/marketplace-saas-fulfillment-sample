# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Azure Developer CLI (azd) config for the one-command CLOUD DEMO.
#   azd up    provisions infra/ (App Service + Azure SQL, passwordless via managed identity)
#             grants the app's managed identity a database user, then deploys the app.
#   azd down  tears everything down.
#
# This is the automated equivalent of the manual walkthrough in docs/deploy.md.
# Nothing here runs automatically — a person runs `azd up` (provisioning is human-authorized).
name: marketplace-saas-fulfillment-sample
metadata:
  template: marketplace-saas-fulfillment-sample@0.1.0

requiredVersions:
  azd: ">= 1.33.0"

services:
  web:
    project: ./src/SaaSAgentSample.Web
    language: dotnet
    host: appservice
  # The Fulfillment API Emulator (Microsoft's token-free marketplace stand-in), so the cloud
  # demo is interactive end to end: generate a token in its UI, activate on the app's landing
  # page, then drive webhooks — all in the browser. Its Dockerfile is built remotely in ACR
  # (remoteBuild) so no local Docker/npm is needed. Source is vendored in ./emulator (derived
  # from microsoft/Commercial-Marketplace-SaaS-API-Emulator, MIT — see emulator/NOTICE.md).
  emulator:
    project: ./emulator
    language: docker
    host: containerapp
    docker:
      path: docker/Dockerfile
      remoteBuild: true

hooks:
  # Select a region before up resolves Bicep parameters; preprovision would be too late.
  # See docs/deployment-regions.md for permissions, costs, limitations, and unattended use.
  preup:
    windows:
      shell: pwsh
      run: ./scripts/preup.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/preup.sh
      interactive: true
      continueOnError: false
  # Azure SQL cannot create a contained user for a managed identity via ARM/Bicep alone,
  # so azd runs this once after provisioning. It connects as the Entra admin (you, the
  # deployer) and creates a least-privilege DB user for the web app's managed identity.
  # This mirrors step 2 of docs/deploy.md. If it fails (e.g. sqlcmd not installed), run
  # that manual SQL step instead.
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/postprovision.sh
      interactive: true
      continueOnError: false
  # After `azd up` completes, print a short "start here" guide (which URL to open
  # first, and the three-role flow) so it's obvious in the terminal without reading
  # the README. Purely informational — never fail the run.
  postup:
    windows:
      shell: pwsh
      run: ./scripts/postup.ps1
      interactive: true
      continueOnError: true
    posix:
      shell: sh
      run: ./scripts/postup.sh
      interactive: true
      continueOnError: true
