<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marketplace API Emulator</title>
    <link rel="stylesheet" href="core.css" />
    <link rel="stylesheet" href="offers.css" />
    <script src="https://code.jquery.com/jquery-3.6.3.min.js" integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
    <script src="notifications.js"></script>
    <script src="core.js"></script>
    <script src="i18n.js"></script>
    <script src="offers.js"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
    <link rel="manifest" href="images/site.webmanifest" />
  </head>
  <body>
    <header><h1>Azure Marketplace API Emulator</h1></header>
    <nav><ul>
                <li><a href="/" data-i18n="nav.marketplace">Marketplace</a></li>
                <li><a href="/subscriptions.html" data-i18n="nav.subscriptions">Subscriptions</a></li>
                <li><a href="/landing.html" data-i18n="nav.landingPage">Landing Page</a></li>
                <li><a href="/offers.html" class="active" data-i18n="nav.offers">Offers</a></li>
                <li><a href="/config.html" data-i18n="nav.config">Config</a></li>
                <li><a href="https://github.com/microsoft/Commercial-Marketplace-SaaS-API-Emulator/issues" target="_blank"><svg height="24" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="24" data-view-component="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg></a></li>
            </ul></nav>
        <p class="page-hint" data-i18n="hint.offers">Create and manage the sample offers and plans.</p>
    <main>
      <section class="info"><header data-i18n="common.introduction">Introduction</header><article data-i18n-html="offers.infoHtml"></article></section>
      <section class="main">
        <header data-i18n="common.offerCentral">Offer Central</header>
        <section class="offers"></section>
        <section class="detail">
          <div>
            <header data-i18n="common.offer">Offer</header>
            <div><label data-i18n="common.offerName">Offer Name</label><input id="offer-name" /></div>
            <div><label data-i18n="common.offerId">Offer Id</label><input id="offer-id" /></div>
            <div><label data-i18n="common.priceModel">Price Model</label><select id="per-seat"><option value="true" data-i18n="common.perSeat">Per Seat</option><option value="false" data-i18n="common.flatRate">Flat Rate</option></select></div>
            <table>
              <thead><tr><th data-i18n="common.planName">Plan Name</th><th data-i18n="common.planId">Plan Id</th><th data-i18n="common.billingTerm">Billing Term</th><th data-i18n="common.price">Price</th><th></th></tr></thead>
              <tbody><tr class="template"><td class="plan-name"><input /></td><td class="plan-id"><input /></td><td class="billing-term"><select><option value="P1M" data-i18n="common.oneMonth">1 Month</option><option value="P1Y" data-i18n="common.oneYear">1 Year</option></select></td><td class="price"><input /></td><td><button onclick="addRow_click(event)">+</button><button onclick="deleteRow_click(event)" class="danger">x</button></td></tr></tbody>
              <tfoot><tr><td colspan="5"><button class="custom new primary" onclick="saveOffer_click(event)" data-i18n="common.save">Save</button><button class="custom danger" onclick="deleteOffer_click(event)" data-i18n="common.delete">Delete</button><button class="custom built-in" onclick="clone_click(event)" data-i18n="common.clone">Clone</button><button class="custom new built-in" onclick="cancel_click(event)" data-i18n="common.cancel">Cancel</button></td></tr></tfoot>
            </table>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
